[project]
name = "pi-agents-anywhere"
version = "0.1.0"
description = "Pi coding agent as an Agents Anywhere runtime (connector adapter)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Seryta" },
]
keywords = ["pi", "agents-anywhere", "connector", "coding-agent", "runtime"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
requires-python = ">=3.12"
dependencies = [
    "anywhere-cli>=2.0.0",
]

[project.urls]
Repository = "https://github.com/Seryta/pi-agents-anywhere"
Issues = "https://github.com/Seryta/pi-agents-anywhere/issues"

[project.scripts]
pi-aa-connector = "pi_aa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pi_aa"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
