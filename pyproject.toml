[project]
name = "pi-agents-anywhere"
version = "0.1.0"
description = "Pi coding agent as an Agents Anywhere runtime (connector adapter)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anywhere-cli>=2.0.0",
]

[project.scripts]
pi-aa-connector = "pi_aa.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pi_aa"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
